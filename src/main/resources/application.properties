spring.application.name=ger-orcamentos

spring.datasource.url=sua url aqui
spring.datasource.username=seu usuario aqui
spring.datasource.password=sua senha aqui

# Configurações recomendadas do Hibernate/JPA para o MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.ai.google.genai.api-key=${GEMINI_API_KEY}).
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
