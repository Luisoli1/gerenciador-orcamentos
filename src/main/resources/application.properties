spring.application.name=ger-orcamentos
server.port=${PORT:8080}

# Configuração do Banco de Dados MySQL com suporte a variáveis do Render
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/gerenciador_orcamentos?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Impal@67}

# Configurações do Hibernate/JPA para MySQL com Batching de Alto Desempenho
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# Otimização do pool Hikari para menor latência
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Google Gemini API Key - Suporta SPRING_AI_GOOGLE_GENAI_API_KEY ou GEMINI_API_KEY
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY:${GEMINI_API_KEY:}}
spring.ai.google.genai.chat.options.model=${SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL:gemini-3.5-flash-lite}

# Configurações de Upload Multipart (PDFs de Catálogos e Orçamentos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
